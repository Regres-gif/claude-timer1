name: Build Claude Timer APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Project Files
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/claudewindows
          printf '%s\n' \
            'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' \
            'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' \
            'rootProject.name = "ClaudeWindows"' \
            'include(":app")' > settings.gradle.kts
          printf '%s\n' \
            'plugins {' \
            '    id("com.android.application") version "8.2.0" apply false' \
            '    id("org.jetbrains.kotlin.android") version "1.9.20" apply false' \
            '}' > build.gradle.kts
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'kotlin.code.style=official' > gradle.properties
          printf '%s\n' \
            'plugins {' \
            '    id("com.android.application")' \
            '    id("org.jetbrains.kotlin.android")' \
            '}' \
            'android {' \
            '    namespace = "com.example.claudewindows"' \
            '    compileSdk = 34' \
            '    defaultConfig {' \
            '        applicationId = "com.example.claudewindows"' \
            '        minSdk = 26' \
            '        targetSdk = 34' \
            '        versionCode = 1' \
            '        versionName = "1.0"' \
            '    }' \
            '    compileOptions {' \
            '        sourceCompatibility = JavaVersion.VERSION_17' \
            '        targetCompatibility = JavaVersion.VERSION_17' \
            '    }' \
            '    kotlinOptions { jvmTarget = "17" }' \
            '    buildFeatures { compose = true }' \
            '    composeOptions { kotlinCompilerExtensionVersion = "1.5.4" }' \
            '}' \
            'dependencies {' \
            '    implementation(platform("androidx.compose:compose-bom:2023.10.01"))' \
            '    implementation("androidx.activity:activity-compose:1.8.1")' \
            '    implementation("androidx.compose.ui:ui")' \
            '    implementation("androidx.compose.material3:material3")' \
            '}' > app/build.gradle.kts
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <application android:allowBackup="true" android:label="Claude Вікна" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">' \
            '        <activity android:name=".MainActivity" android:exported="true">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '    </application>' \
            '</manifest>' > app/src/main/AndroidManifest.xml
          printf '%s\n' \
            'package com.example.claudewindows' \
            'import android.content.*' \
            'import android.net.Uri' \
            'import android.os.Bundle' \
            'import android.widget.Toast' \
            'import androidx.activity.ComponentActivity' \
            'import androidx.activity.compose.setContent' \
            'import androidx.compose.foundation.background' \
            'import androidx.compose.foundation.layout.*' \
            'import androidx.compose.foundation.shape.RoundedCornerShape' \
            'import androidx.compose.material3.*' \
            'import androidx.compose.runtime.*' \
            'import androidx.compose.ui.Alignment' \
            'import androidx.compose.ui.Modifier' \
            'import androidx.compose.ui.graphics.Color' \
            'import androidx.compose.ui.platform.LocalContext' \
            'import androidx.compose.ui.text.font.FontWeight' \
            'import androidx.compose.ui.text.style.TextAlign' \
            'import androidx.compose.ui.unit.dp' \
            'import androidx.compose.ui.unit.sp' \
            'import kotlinx.coroutines.delay' \
            'import java.time.LocalTime' \
            'import java.time.format.DateTimeFormatter' \
            'class MainActivity : ComponentActivity() {' \
            '    override fun onCreate(savedInstanceState: Bundle?) {' \
            '        super.onCreate(savedInstanceState)' \
            '        setContent { MaterialTheme(colorScheme = darkColorScheme()) { ClaudeWindowTrackerScreen() } }' \
            '    }' \
            '}' \
            '@Composable' \
            'fun ClaudeWindowTrackerScreen() {' \
            '    val context = LocalContext.current' \
            '    var currentTime by remember { mutableStateOf(LocalTime.now()) }' \
            '    val tf = DateTimeFormatter.ofPattern("HH:mm")' \
            '    LaunchedEffect(Unit) { while (true) { currentTime = LocalTime.now(); delay(1000L) } }' \
            '    val windows = remember(currentTime.minute) {' \
            '        val list = mutableListOf<Pair<LocalTime, LocalTime>>()' \
            '        var start = currentTime' \
            '        for (i in 1..4) {' \
            '            val end = start.plusHours(5)' \
            '            list.add(Pair(start, end))' \
            '            if (end.isBefore(start) || end == LocalTime.MIDNIGHT) break' \
            '            start = end' \
            '        }' \
            '        list' \
            '    }' \
            '    Column(modifier = Modifier.fillMaxSize().background(Color(0xFF191919)).padding(20.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {' \
            '        Text("Планувальник Claude", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color(0xFFD97757))' \
            '        Spacer(Modifier.height(8.dp))' \
            '        Text("Зараз: " + currentTime.format(tf), fontSize = 32.sp, fontWeight = FontWeight.ExtraBold, color = Color.White)' \
            '        Spacer(Modifier.height(20.dp))' \
            '        Card(modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF262625))) {' \
            '            Column(Modifier.padding(16.dp)) {' \
            '                val s1 = windows.first().first.format(tf)' \
            '                val e1 = windows.first().second.format(tf)' \
            '                val e2 = windows.getOrNull(1)?.second?.format(tf) ?: "00:00"' \
            '                Text("Якщо надішлеш Claude повідомлення зараз (" + s1 + "), то почнеться відлік 5-годинного вікна, вікно закінчиться в " + e1 + ". В " + e1 + " почнеться нове і закінчиться в " + e2 + " і так далі до 00:00 ночі.", color = Color(0xFFECECEC), fontSize = 15.sp, lineHeight = 22.sp)' \
            '                Spacer(Modifier.height(16.dp))' \
            '                windows.forEachIndexed { idx, pair ->' \
            '                    Row(modifier = Modifier.fillMaxWidth().padding(vertical = 6.dp), horizontalArrangement = Arrangement.SpaceBetween) {' \
            '                        Text(if (idx == 0) "1-ше вікно (зараз):" else "${idx + 1}-ге вікно:", color = if (idx == 0) Color(0xFF6EE7B7) else Color.White, fontWeight = FontWeight.Bold)' \
            '                        Text(pair.first.format(tf) + " — " + pair.second.format(tf), color = Color.White, fontWeight = FontWeight.Bold)' \
            '                    }' \
            '                }' \
            '            }' \
            '        }' \
            '        Spacer(Modifier.height(24.dp))' \
            '        Button(onClick = {' \
            '            val cb = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager' \
            '            cb.setPrimaryClip(ClipData.newPlainText("claude", "hello"))' \
            '            Toast.makeText(context, "hello скопійовано! Перевірте Haiku (Low)", Toast.LENGTH_LONG).show()' \
            '            context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://claude.ai/new?q=hello")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))' \
            '        }, modifier = Modifier.fillMaxWidth().height(56.dp), shape = RoundedCornerShape(14.dp), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD97757))) {' \
            '            Text("Надіслати повідомлення (hello)", fontSize = 17.sp, fontWeight = FontWeight.Bold, color = Color.White)' \
            '        }' \
            '        Spacer(Modifier.height(12.dp))' \
            '        Text("Модель: Haiku (Effort: Low). Слово hello вставляється автоматично.", color = Color(0xFF9E9E9E), fontSize = 12.sp, textAlign = TextAlign.Center)' \
            '    }' \
            '}' > app/src/main/java/com/example/claudewindows/MainActivity.kt

      - name: Build Debug APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: claude-timer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
